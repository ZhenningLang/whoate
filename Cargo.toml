[workspace]
members = ["crates/whoate-core", "crates/whoate-cli", "crates/whoate-ffi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
plist = "1"
toml = "0.9"
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros", "serde"] }
jsonschema = { version = "0.33", default-features = false }
