# Thresholds approved in Phase 07 ORCHESTRATOR_RULING, 2026-10-17.
# Product heuristics, not Apple normal-memory baselines. Sources describe
# service behavior; they do not purport to establish these product thresholds.
[kernel_zones]
watch_bytes = 2147483648
act_bytes = 4294967296
source = "man 1 zprint"
checked = "2026-10-17"

[[entries]]
id = "system.fseventsd"
recognizer = "system-services"
source = "man 1 launchctl"
checked = "2026-10-17"
trigger = { kind = "system_service", member = "fseventsd" }
cause = { zh = "文件事件服务长期高占用，可能累积内存。", en = "Long-running filesystem event service has high memory; accumulation is possible." }
advice = { zh = "仅展示管理员重启命令；whoate 不会执行。", en = "Display the administrator restart command only; whoate will not execute it." }
[entries.system]
member = "fseventsd"
watch = { bytes = 1073741824, uptime_seconds = 259200 }
act = { bytes = 3221225472, uptime_seconds = 604800 }
restart = "fseventsd"
baseline = { zh = "Apple 常态基线未知；阈值为产品启发式。", en = "Apple baseline unknown; thresholds are product heuristics." }
restart_safety = { zh = "可考虑重启，但系统策略可能拒绝。", en = "Restart may be considered, but system policy may deny it." }
launchd = { zh = "launchd 会自动重新拉起。", en = "launchd automatically starts the service again." }
permissions = { zh = "需要管理员权限。", en = "Requires administrator privileges." }
side_effects = { zh = "部分 CLI 文件监听重启后可能不重连，需重开对应工具。", en = "Some CLI file watchers may not reconnect; reopen affected tools." }
provenance = [{ kind = "local_doc", reference = "man 1 launchctl" }, { kind = "local_doc", reference = "/System/Library/LaunchDaemons/com.apple.fseventsd.plist" }, { kind = "owner_report", date = "2026-10-16", description = "Owner reported fseventsd at 5.6–5.8GB after 17 days and about 6MB after restart; some watchers did not reconnect. Not reproduced by this diagnostic." }]

[[entries]]
id = "system.mds"
recognizer = "system-services"
source = "man 8 mds"
checked = "2026-10-17"
trigger = { kind = "system_service", member = "mds" }
cause = { zh = "Spotlight 服务高占用，可能正在索引，不等于泄漏。", en = "Spotlight has high memory; active indexing is possible, not proof of a leak." }
advice = { zh = "先用 mdutil -s / 查看索引状态；仅展示管理员重启命令。", en = "Check indexing with mdutil -s / first; display the administrator restart command only." }
[entries.system]
member = "mds"
watch = { bytes = 1610612736, uptime_seconds = 86400 }
act = { bytes = 4294967296, uptime_seconds = 259200 }
restart = "spotlight"
baseline = { zh = "Apple 常态基线未知；阈值为产品启发式。", en = "Apple baseline unknown; thresholds are product heuristics." }
restart_safety = { zh = "索引期间优先等待；系统策略可能拒绝重启。", en = "Prefer waiting during indexing; system policy may deny restart." }
launchd = { zh = "mds 由 launchd 自动拉起。", en = "launchd automatically starts mds again." }
permissions = { zh = "重启需要管理员权限。", en = "Restart requires administrator privileges." }
side_effects = { zh = "重启会重新索引，暂时增加磁盘和 CPU 负载。", en = "Restart causes reindexing and temporary disk and CPU load." }
provenance = [{ kind = "local_doc", reference = "man 8 mds" }, { kind = "local_doc", reference = "/System/Library/LaunchDaemons/com.apple.metadata.mds.plist" }]

