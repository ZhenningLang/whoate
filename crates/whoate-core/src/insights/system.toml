[[entries]]
id = "system.mdworker"
recognizer = "system-services"
source = "man 8 mdworker"
checked = "2026-10-17"
trigger = { kind = "system_service", member = "mdworker" }
cause = { zh = "Spotlight 工作进程占用大，通常是短命索引任务。", en = "A Spotlight worker has high memory; indexing workers are usually short-lived." }
advice = { zh = "等待索引结束，用 mdutil -s / 查看状态。", en = "Wait for indexing to finish; check status with mdutil -s /." }
[entries.system]
member = "mdworker"
watch = { bytes = 1073741824, uptime_seconds = 0 }
restart = "none"
baseline = { zh = "Apple 常态基线未知；1 GiB 是产品启发式。", en = "Apple baseline unknown; 1 GiB is a product heuristic." }
restart_safety = { zh = "不建议手动重启工作进程。", en = "Do not manually restart workers." }
launchd = { zh = "工作进程按索引需求启动，不保证同一实例重拉。", en = "Workers start on indexing demand; restart of the same instance is not guaranteed." }
permissions = { zh = "查看状态不需要管理员权限。", en = "Status inspection does not require administrator privileges." }
side_effects = { zh = "打断任务可能重复索引。", en = "Interrupting work may repeat indexing." }
provenance = [{ kind = "local_doc", reference = "man 8 mdworker" }]

