[[entries]]
id = "vite.profile"
recognizer = "dev-runtimes"
trigger = { kind = "all", triggers = [{ kind = "count", signal = "software_vite", min = 1 }, { kind = "memory", min_bytes = 536870912 }] }
cause = { zh = "此归属包含 Vite，资源较高；插件和转换工作可能值得检查。", en = "This owner includes Vite and has elevated usage; plugin and transform work may merit inspection." }
advice = { zh = "用 vite --profile 录制，再按 p 和回车导出性能记录。", en = "Run vite --profile, then press p and Enter to export a performance recording." }
source = "https://vite.dev/guide/performance"
checked = "2026-10-16"

[[entries]]
id = "vite.imports"
recognizer = "dev-runtimes"
trigger = { kind = "all", triggers = [{ kind = "count", signal = "software_vite", min = 1 }, { kind = "memory", min_bytes = 1073741824 }] }
cause = { zh = "大型依赖和聚合导出可能增加 Vite 转换工作；这里尚未检查项目源码。", en = "Large dependencies and barrel exports can increase Vite transform work; project source was not inspected." }
advice = { zh = "检查聚合导出；按需动态导入只在特定场景使用的大依赖。", en = "Review barrel exports and dynamically import large dependencies used only in specific cases." }
source = "https://vite.dev/guide/performance"
checked = "2026-10-16"

[[entries]]
id = "next.inspect"
recognizer = "dev-runtimes"
trigger = { kind = "all", triggers = [{ kind = "count", signal = "software_next", min = 1 }, { kind = "memory", min_bytes = 1073741824 }] }
cause = { zh = "此归属含 Next.js；单次内存占用无法确定保留对象的来源。", en = "This owner includes Next.js; a single memory sample cannot identify retained objects." }
advice = { zh = "需要定位时，用 NODE_OPTIONS=--inspect 启动开发服务，并在 DevTools 录制堆快照。", en = "For diagnosis, start the dev server with NODE_OPTIONS=--inspect and record a heap snapshot in DevTools." }
source = "https://nextjs.org/docs/app/guides/memory-usage"
checked = "2026-10-16"

[[entries]]
id = "next.webpack-memory"
recognizer = "dev-runtimes"
trigger = { kind = "all", triggers = [{ kind = "count", signal = "software_next", min = 1 }, { kind = "memory", min_bytes = 2147483648 }] }
cause = { zh = "此归属内存较高；若使用 webpack，可检查其内存优化选项。", en = "This owner has high memory usage; if using webpack, review its memory optimization options." }
advice = { zh = "仅在支持的 Next.js webpack 模式中评估 experimental.webpackMemoryOptimizations；可能增加编译时间。", en = "Evaluate experimental.webpackMemoryOptimizations only in supported Next.js webpack mode; compilation may take longer." }
source = "https://nextjs.org/docs/app/guides/memory-usage"
checked = "2026-10-16"

[[entries]]
id = "webpack.pathinfo"
recognizer = "dev-runtimes"
trigger = { kind = "all", triggers = [{ kind = "count", signal = "software_webpack", min = 1 }, { kind = "memory", min_bytes = 536870912 }] }
cause = { zh = "webpack 的路径信息在大型项目中会增加垃圾回收压力；尚未读取此配置。", en = "webpack path information can add garbage collection pressure in large projects; this configuration was not read." }
advice = { zh = "在大型开发构建中评估 output.pathinfo: false。", en = "Evaluate output.pathinfo: false for large development builds." }
source = "https://webpack.js.org/guides/build-performance/"
checked = "2026-10-16"

[[entries]]
id = "webpack.source-maps"
recognizer = "dev-runtimes"
trigger = { kind = "all", triggers = [{ kind = "count", signal = "software_webpack", min = 1 }, { kind = "memory", min_bytes = 1073741824 }] }
cause = { zh = "开发 source map 的精度会影响构建开销；未确认当前配置。", en = "Development source map precision affects build cost; the current configuration is unknown." }
