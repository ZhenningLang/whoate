checked = "2026-10-16"

[[entries]]
id = "wrangler.snapshot"
recognizer = "dev-runtimes"
trigger = { kind = "all", triggers = [{ kind = "count", signal = "software_wrangler", min = 1 }, { kind = "memory", min_bytes = 536870912 }] }
cause = { zh = "此归属含 Wrangler 开发服务；需要堆快照才能确认对象保留。", en = "This owner includes a Wrangler dev server; a heap snapshot is needed to identify retained objects." }
advice = { zh = "在 Wrangler 终端按 D 打开 DevTools，使用 Memory 面板取快照。", en = "Press D in the Wrangler terminal to open DevTools and take a snapshot in the Memory panel." }
source = "https://developers.cloudflare.com/workers/observability/dev-tools/memory-usage/"
checked = "2026-10-16"

[[entries]]
id = "wrangler.compare"
recognizer = "dev-runtimes"
trigger = { kind = "all", triggers = [{ kind = "count", signal = "software_wrangler", min = 1 }, { kind = "memory", min_bytes = 1073741824 }] }
cause = { zh = "高占用本身不能区分临时分配和持续保留。", en = "High usage alone cannot distinguish temporary allocation from persistent retention." }
advice = { zh = "用相同请求和数据重复取快照，对照对象增量；本工具不自动发送请求。", en = "Compare snapshots using the same requests and data to inspect object growth; this tool sends no requests." }
source = "https://developers.cloudflare.com/workers/observability/dev-tools/memory-usage/"
checked = "2026-10-16"

[[entries]]
id = "tsserver.files"
recognizer = "dev-runtimes"
trigger = { kind = "all", triggers = [{ kind = "count", signal = "software_tsserver", min = 1 }, { kind = "memory", min_bytes = 536870912 }] }
cause = { zh = "TypeScript 语言服务可能加载过多文件；此处尚未读取 tsconfig。", en = "The TypeScript language service may load too many files; tsconfig was not read here." }
advice = { zh = "用 tsc --listFilesOnly 检查文件集合；显式 exclude 时保留 node_modules 和构建目录排除。", en = "Inspect the file set with tsc --listFilesOnly; keep node_modules and build output excluded when using an explicit exclude." }
source = "https://github.com/microsoft/TypeScript/wiki/Performance"
checked = "2026-10-16"

[[entries]]
id = "tsserver.references"
recognizer = "dev-runtimes"
trigger = { kind = "all", triggers = [{ kind = "count", signal = "software_tsserver", min = 1 }, { kind = "memory", min_bytes = 1073741824 }] }
cause = { zh = "大型单工程会增加语言服务负担；占用不能证明具体项目结构有误。", en = "Large single projects can burden the language service; usage does not prove a project structure problem." }
advice = { zh = "对大型 monorepo 评估 project references，并检查加载引用工程的范围。", en = "Evaluate project references for a large monorepo and review the scope of referenced project loading." }
source = "https://github.com/microsoft/TypeScript/wiki/Performance"
