[[entries]]
id = "python.output-cache"
recognizer = "dev-runtimes"
trigger = { kind = "all", triggers = [{ kind = "count", signal = "software_python", min = 1 }, { kind = "count", signal = "python_kernel", min = 1 }, { kind = "memory", min_bytes = 536870912 }] }
cause = { zh = "此归属包含 IPython kernel；Out 缓存可能保留旧结果，但尚未检查 Python 对象。", en = "This owner includes an IPython kernel; Out may retain results, but Python objects were not inspected." }
advice = { zh = "确认不再需要结果后，使用 %reset out 或 %xdel 清理大对象。", en = "After confirming results are no longer needed, use %reset out or %xdel to remove large objects." }
source = "https://ipython.readthedocs.io/en/stable/interactive/reference.html"
checked = "2026-10-16"

[[entries]]
id = "python.cache-limit"
recognizer = "dev-runtimes"
trigger = { kind = "all", triggers = [{ kind = "count", signal = "software_python", min = 1 }, { kind = "count", signal = "python_kernel", min = 1 }, { kind = "memory", min_bytes = 1073741824 }] }
cause = { zh = "IPython 输出缓存会阻止旧结果被回收；这里不把 kernel 内存等同缓存大小。", en = "IPython output caching can prevent collection of old results; kernel memory is not measured cache size." }
advice = { zh = "若不需要输出历史，可评估 InteractiveShell.cache_size = 0 关闭输出缓存。", en = "If output history is unnecessary, consider InteractiveShell.cache_size = 0 to disable output caching." }
source = "https://ipython.readthedocs.io/en/stable/interactive/reference.html"
checked = "2026-10-16"
